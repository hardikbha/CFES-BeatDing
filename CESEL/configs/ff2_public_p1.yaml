    weight: 1.0
    mode: balanced
  stab:
    weight: 0.0
    huber_delta: 1.0
    map_weight: 1.0
    bg_evidence_weight: 0.5
  sens:
    weight: 0.0
    margin: 2.0
    map_margin: 1.0
    map_weight: 1.0
    unchanged_weight: 0.5
    changed_thr: 0.25
    map_terms: true
  loc:
    weight: 0.0
  align:
    weight: 0.0
    temperature: 1.0
    n_min: 2
    require_strat: false
  orth:
    weight: 0.1
  scale:
    weight: 0.0
    cap: 4.0
  mfer_margin:
    weight: 0.0
    margin: 2.0
  mfer_cons:
    weight: 0.0
  mfer_det:
    weight: 0.0
  pair_det:
    weight: 0.0
  strat_det:
    weight: 0.0
mfer:
  enabled: false
  csv: null
  validated: false
  min_groups: 2
  max_groups: 8
  oversize: error
  smoke: false
  sets_per_step: 4
optim:
