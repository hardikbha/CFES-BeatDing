# FF2-PUBLIC phase 1 (Codex review F5 fix, Amendment 4; NOT launched): CFES-CLIP plain detection on the FROZEN public
# TRAIN (release_ff2_public/FREEZE.md; data_ding_schema/fairforge2_public), selection on public SELECT (realval +
# fakeval). = the resolved FF2-full phase-1 recipe (agents/CFES/runs_ff2full/clip_s7_p1/config.yaml = CFES
# configs/ff2_full/clip_p1.yaml: AdamW 1e-3 cosine, warmup 200, batch 64, 50 epochs x 1866 steps, no counterfactual
# losses, val_auc selection) with ONLY the data paths switched from fairforge2_full to fairforge2_public.
# guard (cfes/public_guard.py): refuses to start unless data.train.csv is the frozen public TRAIN (sha256 below) and no
# init checkpoint is given; writes <out>/PUBLIC_P1 (sha256 of last.pt / best.pt) when finished. Phase-2 FF2-public
# configs (cfesd_ff2_public.yaml, ces_ff2_public.yaml and configs/ff2_public/*) refuse to start without it.
# Run with the CESEL copy of the CFES trainer (identical engine/model/losses; the guard lives here, not in agents/CFES):
#   cd agents/CESEL && CUDA_VISIBLE_DEVICES=<i> ~/.conda/envs/pulid/bin/python scripts/train.py \
#       --config configs/ff2_public_p1.yaml --out runs_ff2public/clip_s7_p1 --set seed=7
# (other seeds: --set seed=<s> and --out runs_ff2public/clip_s<s>_p1)
paths:
  fairrel_repo: /home/sachin.chaudhary/ICLR_2027/related_work/FairReL
seed: 7
log_every: 20
model:
  backbone: ViT-L-14
  pretrained: openai
  rank: 1
  pooling: cls
  patch_head:
    enabled: true
    hidden: 256
  score_path: fused
  topk: 8
  alpha_init: 0.0
  alpha_param: raw
  init_from: null
data:
  input_size: 224
  batch_size: 64
  num_workers: 4
  demographics_reliable: true
  pairing: ff2
  train:
    csv: /home/sachin.chaudhary/ICLR_2027/research/cvpr_readiness/r20261009/data_ding_schema/fairforge2_public/train.csv
    scheme: eight
    meta: /home/sachin.chaudhary/ICLR_2027/research/cvpr_readiness/r20261009/data_ding_schema/fairforge2_public/provenance.csv
  val:
    csv:
    - /home/sachin.chaudhary/ICLR_2027/research/cvpr_readiness/r20261009/data_ding_schema/fairforge2_public/realval.csv
    - /home/sachin.chaudhary/ICLR_2027/research/cvpr_readiness/r20261009/data_ding_schema/fairforge2_public/fakeval.csv
    scheme: eight
    meta: /home/sachin.chaudhary/ICLR_2027/research/cvpr_readiness/r20261009/data_ding_schema/fairforge2_public/provenance.csv
  steps_per_epoch: 1866
cf:
  enabled: false
  interventions:
  - bg_blur
  - bg_swap
  - photometric
  probs:
    bg_blur: 0.6
    bg_swap: 0.0
    photometric: 0.4
  bg_blur_sigma:
  - 2.0
  - 6.0
  photometric:
    brightness: 0.08
    contrast: 0.1
    saturation: 0.1
    gamma:
    - 0.9
    - 1.1
  face_mask:
    cx: 0.5
    cy: 0.578
    ax: 0.3125
    ay: 0.4297
    dilate: 1.15
pairs:
  enabled: false
  csv: /home/sachin.chaudhary/ICLR_2027/research/cvpr_readiness/r20261009/agents/CESEL/data/pairs_ff2public_train_cfesformat.csv
  per_step: 8
  shared_intervention: true
  diff_tau: 0.0314
  align_tau: 0.015
