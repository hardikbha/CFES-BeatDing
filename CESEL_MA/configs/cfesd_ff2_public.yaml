  max_steps_per_epoch: null
  max_eval_items: null
  max_pairs: null
  stop_after_epochs: null
  save_val_probs: false
  term_grad_norms: false
train:
  decoupled_rng: true
guard:
  public_only: true
  role: phase2
  public_train_csv: /home/sachin.chaudhary/ICLR_2027/research/cvpr_readiness/r20261009/data_ding_schema/fairforge2_public/train.csv
